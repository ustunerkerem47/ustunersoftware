[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/indir/huma"
  to = "https://humaapp.netlify.app/app/huma.apk"
  status = 302

[[redirects]]
  from = "/indir/defteria"
  to = "https://defteria.netlify.app/Defteria.apk"
  status = 302
