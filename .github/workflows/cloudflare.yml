name: Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'static/**'
      - 'tool/**'
      - 'index.html'
      - 'package*.json'
      - 'vite.config.js'
      - '.github/workflows/cloudflare.yml'
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Kur
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Sürüm bilgileri
        run: node tool/releases.mjs
      - name: Derle
        run: npm run build
      - name: Yayınla
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN yok"; exit 1; }
          npx -y wrangler@4.158.0 pages deploy dist --project-name ustunersoftware --branch main --commit-dirty=true
      - name: Kontrol
        run: |
          sleep 15
          URL=https://ustunersoftware.com.tr
          for p in / /huma /defteria /gizlilik/huma /gizlilik/defteria /huma/hesap-silme /defteria/hesap-silme /og/huma.png /favicon.ico /indir/huma /indir/defteria; do
            echo "$p $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' $URL$p)"
          done
          cat src/data/releases.json
